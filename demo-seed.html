<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>미리보기 시드</title></head>
<body>
<p>미리보기용 임시 페이지입니다. 잠시 뒤 사라집니다…</p>
<script>
(function () {
  function makeImg(label, c1, c2) {
    var c = document.createElement('canvas');
    c.width = 600; c.height = 600;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0, 0, 600, 600);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    x.fillStyle = g; x.fillRect(0, 0, 600, 600);
    x.fillStyle = 'rgba(255,255,255,.85)';
    x.beginPath(); x.arc(300, 300, 190, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#3b4a5c'; x.font = 'bold 54px sans-serif'; x.textAlign = 'center';
    x.fillText(label, 300, 290);
    x.font = '28px sans-serif'; x.fillStyle = '#6b7c90';
    x.fillText('AI 실사 자리 (테스트)', 300, 340);
    return c.toDataURL('image/jpeg', 0.8);
  }

  var text = [

    '## 본문',
    '',
    '주말에 코스트코 갔다가 겨울 코너에서 발이 묶였어요. 이번 주 할인 폭이 커서 결국 카트가 가득 찼네요.',
    '',
    '1. 겨울 이불',
    '지금 ==21,590원==으로 내려왔어요. 지난달보다 6천원 넘게 빠진 가격이에요.',
    '2. 전기요',
    '==3만원대==로 들였는데 전기세 걱정이 확 줄었어요.',
    '3. 온수매트',
    '==싱글 39,900원==이라 아이 방에 하나 더 살까 고민 중이에요.',
    '4. 가습기',
    '필터 값이 비싼 모델은 피하고 ==물통이 큰 5만원대==로 골랐어요.',
    '5. 핫팩',
    '==40개입 9,990원==이라 겨울 내내 쓰기 좋아요.',
    '',
    '## 요약표',
    '코스트코 11월 넷째 주 겨울템 가격 요약',
    '| 구분 | 내용 |',
    '| --- | --- |',
    '| 겨울 이불 | 21,590원 |',
    '| 전기요 | 3만원대 |',
    '| 핫팩 | 9,990원 / 40개 |',
    '',
    '## 마무리',
    '22일 휴무 전에 가면 원하는 걸 고를 수 있어요.',
    '이번 주말 장보기 목록에 미리 적어 두세요.',
    '',
    '## 해시태그',
    '#코스트코 #코스트코할인 #겨울이불 #전기요 #온수매트 #가습기 #핫팩 #울산장보기 #11월할인 #살림꿀팁',
    '',
    '---',
    '## 이미지 프롬프트',
    '1. A cozy winter blanket folded on a Korean sofa, warm daylight.',
    '2. A small electric blanket controller on a bed, soft light.',
    '3. A water mattress in a child room, cozy props.',
    '4. A humidifier with steam in a living room, evening light.',
    '5. Hand warmers packed in a basket, winter props.',
    '',
    '## 썸네일 프롬프트',
    'Square 1:1 Korean thumbnail, ivory top 35%, two-line headline.'
  ].join('\n'); /* keep */

  var images = [
    { id: 'i1', kind: 'body', slot: 1, prompt: 'p1', model: 'gemini-2.5-flash-image', dataUrl: makeImg('1번 사진', '#d9e7f5', '#b9cfe6') },
    { id: 'i2', kind: 'body', slot: 2, prompt: 'p2', model: 'gemini-2.5-flash-image', dataUrl: makeImg('2번 사진', '#f5e6d9', '#e6cfb9') },
    { id: 'i3', kind: 'thumb', slot: 0, prompt: 'p0', model: 'imagen-3.0-generate-002', dataUrl: makeImg('썸네일', '#f2f7ee', '#d8e6cf') }

  var draft = {
    id: 'demo1', blog: 'ttosomi', topic: '코스트코 11월 넷째 주 겨울템', keywords: '코스트코, 겨울 이불',
    title: '"이거 사러 갔다가 3만원 더 썼어요" 코스트코 겨울템 6개',

    meta: '3.5-flash-lite · 24초', picked: false, photos: [], images: images

  var copy = JSON.parse(JSON.stringify(draft));
